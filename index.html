<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Robocub Home Demo</title>
    <meta
      name="description"
      content="Demo video for the Robocub Home receptionist robot project."
    >
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f9;
        --text: #111827;
        --muted: #5b6472;
        --surface: #ffffff;
        --border: #d9dee7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: var(--text);
        background: var(--bg);
      }

      main {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 40px 0;
      }

      header {
        margin-bottom: 20px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 5vw, 4rem);
        line-height: 1;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        max-width: 720px;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.6;
      }

      .video-shell {
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: 0 20px 50px rgb(15 23 42 / 12%);
      }

      .demo-link {
        display: block;
      }

      .demo-link:focus-visible {
        outline: 3px solid #2563eb;
        outline-offset: 4px;
      }

      img {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        background: #000;
      }

      a {
        color: inherit;
        text-decoration-thickness: 1px;
        text-underline-offset: 4px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111318;
          --text: #f6f7f9;
          --muted: #adb5c2;
          --surface: #191d25;
          --border: #303746;
        }

        .video-shell {
          box-shadow: 0 20px 50px rgb(0 0 0 / 30%);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Robocub Home Demo</h1>
        <p>
          Receptionist robot demo video showing the Robocub Home system in
          action.
        </p>
      </header>

      <section class="video-shell" aria-label="Demo video preview">
        <a class="demo-link" href="demo/demo.mp4" aria-label="Open demo video">
          <img src="demo/demo_preview.png" alt="Robocub Home demo video preview">
        </a>
      </section>
    </main>
  </body>
</html>
